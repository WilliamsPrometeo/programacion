<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsup Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <section id="loginView" class="card">
        <h1>Iniciar sesión</h1>
        <p class="hint">Demo: usuario <strong>admin</strong>, contraseña <strong>1234</strong>.</p>

        <form id="loginForm">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
            <p id="loginError" class="error" role="alert"></p>
        </form>
    </section>

    <section id="chatView" class="card hidden">
        <div class="chat-header">
            <div>
                <h1>Whatsup Chat</h1>
                <p id="connectionStatus" class="hint">Conectando...</p>
            </div>
            <button id="logoutButton" type="button" class="secondary">Salir</button>
        </div>

        <div id="messages" aria-live="polite"></div>

        <form id="messageForm" class="input-container">
            <input id="messageInput" type="text" maxlength="500" placeholder="Escribe un mensaje..." autocomplete="off">
            <button id="sendButton" type="submit" disabled>Enviar</button>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
